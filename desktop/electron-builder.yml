appId: com.forge.console
productName: Forge Console
directories:
  output: release

# The main-process bundle and its preload. Nothing else in this checkout
# belongs in the artifact: the console itself is a separate checkout the app
# locates at runtime, never bundled in.
files:
  - build/main.cjs
  - build/icon.png
  - build/status-preload.cjs
  - package.json

asar: true

win:
  # The board's own lane tile, drawn in its palette. electron-builder converts
  # this to the icon formats the installer and the shortcut need.
  icon: build/icon.png
  # No certificate is configured, so signing would fail anyway. Off outright
  # to skip the rcedit/signtool step, which otherwise downloads a macOS
  # code-signing toolchain this build never touches.
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: forge-console-${version}-setup.${ext}

nsis:
  # Per-user, so installing needs no administrator and no elevation prompt.
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Forge Console
  deleteAppDataOnUninstall: false
