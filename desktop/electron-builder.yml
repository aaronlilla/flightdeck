appId: com.forge.console
productName: Forge Console
directories:
  output: release

# The main-process bundle and its preload. Nothing else in this checkout
# belongs in the artifact: the console itself is a separate checkout the app
# locates at runtime, never bundled in.
files:
  - build/main.cjs
  - build/status-preload.cjs
  - package.json

asar: true

# Puts the icon on the exe itself; see the note in the script.
afterPack: scripts/after-pack.cjs

win:
  # The Flightdeck tile, tracked at the repo root so a fresh clone builds with
  # it. The installer takes it from here, the exe gets it from the afterPack
  # hook, and the running window and tray load the same tile from the main
  # bundle (electron/brand.ts).
  icon: ../brand/flightdeck-icon.ico
  # electron-builder's exe edit needs its winCodeSign download, which fails to
  # extract here (macOS symlinks, no symlink privilege). The afterPack hook
  # covers the icon; nothing is signed either way, since no certificate is
  # configured.
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: forge-console-${version}-setup.${ext}

nsis:
  # Per-user, so installing needs no administrator and no elevation prompt.
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Forge Console
  deleteAppDataOnUninstall: false
